[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-mv-session"
description = "Move a Claude Code conversation to another folder so it can be resumed from there."
authors = [
    {name = "Marc-Etienne Barrut", email = "lekva+github@arzaroth.com"},
]
readme = "README.md"
requires-python = "<4.0,>=3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = []

[project.scripts]
claude-mv-session = "claude_mv_session.cli:main"

[tool.hatch.version]
path = "claude_mv_session/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_mv_session"]

[dependency-groups]
dev = [
    "ruff>=0.11.5",
    "ty>=0.0.17",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP009"]

[tool.coverage.run]
source = ["claude_mv_session"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
]
