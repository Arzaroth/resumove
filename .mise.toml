[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Install all dependencies (including dev)"
run = "uv sync"

[tasks.typecheck]
description = "Type-check with ty"
run = "uv run ty check"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check"

[tasks.fmt]
description = "Format with ruff"
run = "uv run ruff format"

[tasks.check]
description = "Typecheck + lint"
depends = ["typecheck", "lint"]

[tasks.test]
description = "Run pytest (fails under 100% line and branch coverage)"
run = "uv run pytest"

[tasks.build]
description = "Build wheel"
run = "uv build"

[tasks.install-tool]
description = "Put claude-mv-session on your PATH as an editable uv tool, so repo edits apply immediately"
run = 'uv tool install --editable --force "{{config_root}}"'

[tasks.uninstall-tool]
description = "Remove the claude-mv-session uv tool"
run = "uv tool uninstall claude-mv-session"
